<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B12">
  <meta name="description" content="Live Store | Premium Video">
  <title>Live Store | Premium Video</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo" aria-label="Live Store logo">L</div>
      <div class="brand">
        <div class="brand-name">Live Store</div>
        <div class="brand-subtitle">YOUR PREMIUM VIDEO DESTINATION</div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="status">
          <span class="status-dot"></span>
          PREMIUM EXPERIENCE
        </div>

        <h1>Welcome to<br>
          <span class="gradient-text">Live Store</span>
        </h1>

        <p>
          Discover your favorite videos in a modern,
          immersive and premium viewing experience.
        </p>

        <div class="hero-decoration" aria-hidden="true"></div>
      </section>

      <section class="videos-section">
        <div class="section-heading">
          <h2>Explore Live Store</h2>
          <span class="premium-badge">✦ PREMIUM</span>
        </div>

        <div id="video-list" class="video-list">
          <div class="empty-state">
            <div class="play-icon">▶</div>
            <h3>Welcome to Live Store</h3>
            <p>Your videos will appear here.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      Powered by <span>Live Store</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
  </html>
