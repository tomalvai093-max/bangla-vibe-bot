<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Store</title>
<style>
body{margin:0;background:#0b1220;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#142b49}
main{max-width:1000px;margin:auto;padding:15px}
a{color:#bcdcff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:#172438;border-radius:12px;overflow:hidden;padding-bottom:12px}
img{width:100%;aspect-ratio:16/9;object-fit:cover}
h3{padding:0 12px}
video{width:100%;background:black}
</style>
</head>
<body>
<header>
<h1>📺 Live Store</h1>
<a href="/admin">Admin Panel</a>
</header>
<main>
<p id="status">ভিডিও লোড হচ্ছে...</p>
<div class="grid" id="videos"></div>
</main>
<script>
async function load(){
 const status=document.getElementById('status');
 const box=document.getElementById('videos');
 try{
  const res=await fetch('/api/videos');
  const videos=await res.json();
  if(!res.ok)throw Error(videos.error||'লোড করা যায়নি');
  box.replaceChildren();
  status.textContent=videos.length?'':'এখনো কোনো ভিডিও নেই।';
  videos.forEach(v=>{
   const card=document.createElement('div');
   card.className='card';
   const img=document.createElement('img');
   img.src=v.thumbnail_url;
   img.alt=v.title;
   const title=document.createElement('h3');
   title.textContent=v.title;
   const video=document.createElement('video');
   video.controls=true;
   video.preload='none';
   video.src=v.video_url;
   video.poster=v.thumbnail_url;
   card.append(img,title,video);
   box.append(card);
  });
 }catch(e){status.textContent=e.message}
}
load();
</script>
</body>
</html>
